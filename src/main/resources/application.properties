spring.application.name=express-market-api

# Porta do servidor Tomcat exigida pelo enunciado do CP4
server.port=8082

# Origens liberadas no CORS (separadas por virgula). Restringir no deploy.
cors.allowed-origins=*

# Banco Oracle da FIAP (preencher usuario e senha antes de executar)
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
