spring.application.name=express-market-api

# Porta do servidor Tomcat exigida pelo enunciado do CP4
server.port=8082

# Origens liberadas no CORS (separadas por virgula). Restringir no deploy.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Banco Oracle. Sem variaveis de ambiente, aponta para o Oracle da FIAP (exige VPN);
# no deploy do Render as variaveis de ambiente sobrescrevem estes valores.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O Oracle da FIAP limita sessoes simultaneas por usuario (ORA-02391). O pool padrao do
# HikariCP e 10 conexoes, o que sozinho ja encosta no teto da conta de aluno.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# update cria a tabela na primeira subida; depois de criada, use validate (ou none) no
# deploy para nao gastar a conexao isolada que o Hibernate abre so para inspecionar o schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
